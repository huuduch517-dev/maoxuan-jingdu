# 论证形状库 与 读法库
#
# 这两样是本项目真正的产出——解读本身不用记，形状和读法要带走。
# 新增门槛：换一本书、换一场争论还用得上，或在本项目里已出现三次以上。
# 每条必须填 example（本站哪一篇哪一段），没有实例的不许进库。

shapes:                       # 论证形状：他怎么对付一个反对意见

  - id: 抢前提
    rule: 不驳对方的原则，改判对方的行为不符合那条原则。
    how: |
      找出对方用来否决你的那条标准，公开接受它、一个字不改；
      然后给出一条可验证的损害路径，说明按对方的做法，那条标准自己要保护的东西会受损。
      论证负担由此整个搬到对方那一边——你不必证明自己的事重要，只需证明主线缺了它会坏。
    cost: 你得真的能说出那条损害路径，三步之内、每一环对方都能自己验证。说不出来就只是嘴硬。
    far: |
      任何说服型文本都能用来拆。现实里用于向上争取资源：
      不要论证你那摊事有价值，要论证对方在乎的那个指标缺了它会掉。
    examples:
      - 反对本本主义 · 第三段：把「完全无异议地执行上级的指示」判成「对上级指示怠工的最妙方法」
      - 必须注意经济工作 · 第一段：接下「一切应服从战争」，再判「取消经济建设不是服从战争，而是削弱战争」
      - 关心群众生活，注意工作方法 · 第三至第五段：先把中心任务立到最硬，再证明只守它连扩红也做不成

  - id: 改事实基础
    rule: 承认对方的判断在旧条件下成立，转而论证条件已经变了。
    how: |
      先把对方的历史依据说足——不削弱它，甚至替对方说得更清楚；
      再指出哪一个外部变量变了，以及它如何改变了原来那条推论的前提。
      关键是只动事实基础，不动对方的推理能力，所以对方不需要承认自己从前错了才能接受。
    cost: 你指出的那个变量必须是对方也看得见的、已经发生的事实；预期中的变化不够用。
    far: |
      用于对付「我们试过，不行」。那句话通常是对的，所以别去证明它错；
      去找当年失败时的某个硬条件，证明它现在不同了。
    examples:
      - 论反对日本帝国主义的策略 · 第一节：「在日本帝国主义打进中国本部来了这一个基本的变化上面，变化了中国各阶级之间的相互关系」
      - 论反对日本帝国主义的策略 · 第三节：「日本侵略的情况变动了中国的阶级关系，不但小资产阶级，而且民族资产阶级，有了参加抗日斗争的可能性」

  - id: 加一层，不拆原路
    rule: 对方的做法在效率上确有道理，拆不掉，于是在它上面叠一层责任。
    how: |
      先承认对方那条路径的效率优势（这一步不能省，否则后面站不住）；
      然后不改路径，只增加必须被知会、必须负责的人。
      代价是流程变重——这个形状是在「拆不掉」的前提下才用的，不是首选。
    cost: 叠上去的那层责任如果无人追究，就只是多一道知会，什么也没改变。
    far: |
      用于对付那种「绕过你但确实更快」的做法：
      不要去堵那条快路，去规定谁必须同时知道、谁同时担责。
    examples:
      - 关于领导方法的若干问题 · 第七段：不废掉上级部门对口直通，只要求「总负责人和分负责人都知道，都负责」

moves:                        # 读法：从文本里把东西读出来的具体动作

  - id: 看他挑来演示的那个例子
    scope: 通用
    rule: 一套方法的适用边界，常常不写在方法里，写在作者挑来演示它的那个例子里。
    how: |
      通篇找出被正反两面完整推演过的那一个案例（其余多是一句带过或设例）。
      然后问：同一套方法换成别的场合，结论还一样硬吗？作者有没有讨论这个差别？
    far: 读任何方法论文章、任何工具的说明书都适用：看它拿什么当样例，那就是它默认的使用场景。
    examples:
      - 关于领导方法的若干问题 · 第七段：全篇唯一走完正反两面的案例是「审查干部」，而那句「就一定能完满地达到」是全篇语气最硬的一处

  - id: 口径的变化
    scope: 通用
    rule: 同一句话在不同年份的形态差异，比这句话本身有信息量。
    how: |
      把同一个论断在不同年份的几种说法并排，逐字比对多了什么、少了什么。
      加了限定词的，说明原版留了洞；多了一段辩护的，说明它从来没被普遍接受。
    far: 读任何反复被引用的口号、法条、公司价值观，都先去找它的早期版本。
    examples:
      - 反对本本主义 · 第一节：1930「没有调查，没有发言权」→ 1931 注〔1〕加「不做正确的调查同样没有发言权」→ 1941《农村调查》序言加一场辩护

  - id: 正文与注释的落差
    scope: 通用
    rule: 正文倚重的那件事，看同一本书的注释怎么说它。
    how: |
      正文把主张挂靠在另外几件事上时，逐一去翻那几件事的注释。
      注意区分：注释补充的史实可引；注释夹带的评断是编注者的判断，必须标明。
    far: 读报告、读论文都适用：看它引的那几份材料后来被怎么评价。
    examples:
      - 必须注意经济工作 · 第十段：正文说经济建设与查田运动「不能分离」，而注〔3〕末尾写着「在这次查田运动中，存在着'左'的错误」

  - id: 数字的三个形态
    scope: 通用
    rule: 一个漂亮的整数背后，原始记录里通常还有一个不那么漂亮的数。
    how: |
      看到动员场合给出的整数，先找它的原始出处（调查、统计、原始记录）。
      比三件事：口径（统计的到底是什么）、范围（取的是整体还是其中一部分）、后来有没有被校订过。
    far: 读任何标杆案例、任何「某某提升了百分之多少」都适用。
    examples:
      - 关心群众生活，注意工作方法 · 第六段：正文「才溪乡百个人中有八十八个」，注〔3〕所引《才溪乡调查》实为上才溪 88%、下才溪 70%；1991 年第二版另改「男女」为「男子」、「四千五百」为「五千四百」

  - id: 找让步的那半句
    scope: 通用
    rule: 劝人、反驳时先让出去的半句，往往比结论更接近他的真实立场。
    how: 找「不是……而是」「我们承认……但是」这类结构，把让出去的那半句单独读一遍。
    far: 通用。谈判记录、辩论、道歉声明里最有信息量的都是让步的那半句。
    examples:
      - 反对本本主义 · 第三段：「我们说上级领导机关的指示是正确的，决不单是因为它出于'上级领导机关'」——他保住了指示，只拆掉理由

  - id: 看他做了什么
    scope: 通用
    rule: 立场在力气花在哪儿——篇幅分配比表态可靠。
    how: 数各节字数、数某个词出现几次、看哪一段被反复回去写。标题把两件事并列时，尤其要量。
    far: 通用。看一份计划真正的重点，去量它各部分的篇幅与人力。
    examples:
      - 关心群众生活，注意工作方法：标题把「群众生活」与「工作方法」并列，但前者占第一至第八段，后者只有第九至第十二段
      - 论反对日本帝国主义的策略：四节 4948 / 2311 / 2920 / 545 字，第一节是第四节的九倍

  - id: 找对不上的地方
    scope: 通用
    rule: 同一人前后两句对不上：至少一句不真，或者中间发生了什么。也用来对版本接缝。
    how: 同一主张在文中出现两次时逐字比，措辞变强还是变弱；跨篇则看隔了几年、中间处境变了什么。
    far: 通用。对版本、对口供、对两次汇报。
    examples:
      - 反对本本主义 · 第七节（5）要求从乡政府主席到中央政府主席人人亲身调查，不设豁免；十三年后《关于领导方法的若干问题》改成按层级分派
