# 全站唯一主题词表。篇目 frontmatter 的 themes 只能从此处选，不自创。
# 切分原则：按「思维动作」切，不按党史分期切，也不用覆盖一切的大词
#（"实事求是""思想方法""群众路线"这类一律不设，它们等于不切分）。
# 每篇挂 2-4 个。

- name: 调查与事实获取
  definition: 怎么拿到能据以行动的事实，以及为什么二手汇报会失真到不能用
  articles: [反对本本主义, 湖南农民运动考察报告, 中国社会各阶级的分析, 改造我们的学习]

- name: 信息在层级中的失真
  definition: 同一件事从下往上报、从上往下传时各丢掉什么，以及用什么装置把它补回来
  articles: [关于领导方法的若干问题, 关于健全党委制, 党委会的工作方法, 反对本本主义]

- name: 矛盾与优先级
  definition: 一堆问题同时报警时，判断哪一个是承重墙、解决它能否让其余自动缓解
  articles: [矛盾论, 中国革命战争的战略问题, 目前形势和我们的任务, 关于领导方法的若干问题]

- name: 长期与阶段
  definition: 把一个看不到头的过程切成阶段，切分依据从哪来，以及依据变了阶段怎么变
  articles: [论持久战, 抗日游击战争的战略问题, 星星之火，可以燎原, 中国的红色政权为什么能够存在？, 愚公移山]

- name: 阵营划分
  definition: 谁算自己人、谁算对手、中间地带算什么，以及这条线什么时候要重划
  articles: [中国社会各阶级的分析, 论反对日本帝国主义的策略, 中国革命和中国共产党, 新民主主义论]

- name: 力量对比与估算
  definition: 怎么把"强弱"拆成一组可比的变量，而不是停在印象上
  articles: [论持久战, 中国革命战争的战略问题, 中国的红色政权为什么能够存在？, 目前形势和我们的任务]

- name: 联合与妥协
  definition: 划完线之后怎么跟非自己人打交道——让什么、守什么、怎么防止让过头
  articles: [目前抗日统一战线中的策略问题, 关于重庆谈判, 论联合政府, 论反对日本帝国主义的策略]

- name: 组织建设与纪律
  definition: 让一个组织在长期压力下不散架的具体装置（不是口号，是装置）
  articles: [关于纠正党内的错误思想, 井冈山的斗争, 中国共产党在民族战争中的地位, 《共产党人》发刊词, 为人民服务]

- name: 会议与决议
  definition: 决定怎么做出来、怎么写下来、怎么让它真的被执行而不是停在纸上
  articles: [党委会的工作方法, 关于健全党委制, 关于领导方法的若干问题, 在中国共产党第七届中央委员会第二次全体会议上的报告]

- name: 认识循环与纠错
  definition: 判断→行动→检验→修正这套循环的具体走法，以及在哪一步最容易断
  articles: [实践论, 矛盾论, 改造我们的学习, 关于领导方法的若干问题]

- name: 表达与说服
  definition: 话怎么说才能落到对方那里——面向谁、用谁的话、先破还是先立
  articles: [反对党八股, 整顿党的作风, 在延安文艺座谈会上的讲话, 为人民服务]
